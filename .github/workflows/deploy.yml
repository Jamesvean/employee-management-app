name: Employee Management CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t employee-management-app:latest \
            -t jamesaws/employee-management-app:latest \
            -t jamesaws/employee-management-app:${{ github.sha }} .

      - name: Run Container
        run: |
          docker run -d \
            --name employee-management \
            -p 5000:5000 \
            employee-management-app:latest

      - name: Wait for Application
        run: |
          sleep 10

      - name: Health Check
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            http://localhost:5000/health

      - name: Stop Test Container
        if: always()
        run: |
          docker stop employee-management || true
          docker rm employee-management || true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Images
        run: |
          docker push jamesaws/employee-management-app:latest
          docker push jamesaws/employee-management-app:${{ github.sha }}

  deploy:
    needs: build-test-push
    runs-on: self-hosted

    steps:
      - name: Pull Latest Docker Image
        run: |
          docker pull jamesaws/employee-management-app:latest

      - name: Stop and Remove Old Container
        run: |
          docker stop employee-management || true
          docker rm employee-management || true

      - name: Deploy New Container
        run: |
          docker run -d \
            --name employee-management \
            --restart unless-stopped \
            -p 5000:5000 \
            jamesaws/employee-management-app:latest

      - name: Wait for Application
        run: |
          sleep 10

      - name: Deployment Health Check
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            http://localhost:5000/health
