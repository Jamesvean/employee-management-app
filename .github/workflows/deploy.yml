name: Employee Management CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t employee-management-app:latest .

      - name: Run Container
        run: |
          docker run -d \
            --name employee-management \
            -p 5000:5000 \
            employee-management-app:latest

      - name: Wait for Application
        run: sleep 10

      - name: Health Check
        run: curl -f http://localhost:5000/health

            - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag \
            employee-management-app:latest \
            jamesaws/employee-management-app:latest

      - name: Push Docker Image
        run: |
          docker push jamesaws/employee-management-app:latest

